name: Test, build and push Docker images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint with pycodestyle
        run: pycodestyle src test
      - name: Test with pytest
        run: PYTHONPATH=./:./src pytest -v test

  build-and-push:
    needs: tests
    # Публикуем образы только после push в main, не для pull request
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push inference service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/titanic-inference:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/titanic-inference:${{ github.sha }}
          cache-from: type=gha,scope=inference
          cache-to: type=gha,mode=max,scope=inference
      - name: Build and push Keycloak image
        uses: docker/build-push-action@v6
        with:
          context: ./keycloak/docker
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/titanic-keycloak:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/titanic-keycloak:${{ github.sha }}
          cache-from: type=gha,scope=keycloak
          cache-to: type=gha,mode=max,scope=keycloak
